# The repository's version is in VERSION: upstream's release, then -jj.<n> for this repository's
# patch level on it. A merge to main that changes VERSION tags and releases v<version>, then
# publishes the image. A version already released publishes nothing, so bump VERSION with every
# change to the Dockerfile or the patches.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-jj\.[0-9]+$ ]] || { echo "::error::VERSION is not <upstream x.y.z>-jj.<n>: $version"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Release the version once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upstream="${TAG%-jj.*}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "git-pkgs/proxy ${upstream} with the patches in proxy/patches/ at this tag. Upstream notes: https://github.com/git-pkgs/proxy/releases/tag/${upstream}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tag]
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
