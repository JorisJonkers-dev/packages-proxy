# Lint, the patched upstream suite and the restricted smoke test run in parallel; "Pipeline
# Complete" is the required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Download actionlint
        id: actionlint
        shell: bash
        run: bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint GitHub Actions workflows
        run: '"${{ steps.actionlint.outputs.executable }}" -color .github/workflows/*.yml'

  # Every patch applies to the pinned release, and upstream's own tests pass on the result.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Writes the proxy key to ~/.netrc, which the build mounts as a BuildKit secret.
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true

      - name: Run upstream's suite on the patched source
        run: |
          docker buildx build --target test \
            --build-arg GOPROXY=https://packages.jorisjonkers.dev/go \
            --secret id=packages-netrc,src="$HOME/.netrc" \
            proxy

  # The image as the estate runs it: uid 1000, a read-only root, every capability dropped.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Writes the proxy key to ~/.netrc, which the build mounts as a BuildKit secret.
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd # v0.50.1
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true

      - name: Build the image
        run: |
          docker buildx build --load -t packages-proxy:ci \
            --build-arg GOPROXY=https://packages.jorisjonkers.dev/go \
            --secret id=packages-netrc,src="$HOME/.netrc" \
            proxy

      - name: Start the image under the restricted posture
        run: scripts/smoke-test.sh packages-proxy:ci

  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [lint, test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job ended $result"; exit 1; }
          done
